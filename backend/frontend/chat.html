<script src="assets/app.js"></script>
<script>
(function () {
  // 对话台 L2 问句 chip 接线（spec「对话台 L2 问句 chip 触发统一入口」）：
  // 点击以 chip 文案为 question（不含 intent）调 /conversation/message；
  // write_intent=true 渲染二次确认卡（未确认不发写请求），否则 renderDualProduct 直出双产物。
  const body = document.querySelector('.chat .body');
  if (!body || !window.api || !window.renderDualProduct || !window.aiBody) return;

  document.querySelectorAll('.qs.l2').forEach(chip => {
    chip.addEventListener('click', () => ask(chip.textContent.trim()));
  });

  // 自由输入框（L2 自由输入走外部 LLM NLU）：回车或点击发送 → 同一 ask 通道。
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  function send() {
    const q = (input && input.value ? input.value : '').trim();
    if (!q) return;
    input.value = '';
    ask(q);
  }
  if (sendBtn) sendBtn.addEventListener('click', send);
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  async function ask(question) {
    const u = document.createElement('div');
    u.className = 'bub u';
    u.textContent = question;
    body.appendChild(u);
    const out = document.createElement('div');
    body.appendChild(out);
    try {
      const resp = await window.api('/conversation/message', { method: 'POST', body: window.aiBody({ question }) });
      if (resp.write_intent) renderConfirm(out, resp);
      else window.renderDualProduct(out, resp);
    } catch (e) {
      out.innerHTML = '<div class="ai-card degraded"><div class="rh">请求失败</div><div class="rb">'
        + window.escapeHtml((e.body && e.body.message) || e.message) + '</div></div>';
    }
  }

  function renderConfirm(out, resp) {
    // 写意图（③④）→ 二次确认卡；③ 确认后以 suggestion_id 调 weight/apply，④ 交移库落地流。
    const ai = resp.ai ? '<div class="cl"><b>建议</b><span>' + window.escapeHtml(resp.ai).replace(/\n/g, '<br>') + '</span></div>' : '';
    let action = '';
    if (resp.intent === 'WEIGHT_TUNE') {
      action = '<button class="btn warn" data-adopt>确认采纳（写权重）</button>';
    } else if (resp.intent === 'RELOCATE_PROPOSE') {
      action = '<a class="btn warn" style="text-decoration:none;" href="transfer.html">前往移库作业确认 ›</a>';
    }
    out.innerHTML = '<div class="confirm-card"><div class="ch">⚠ 二次确认卡 · 写操作（未确认不执行）</div>'
      + ai
      + '<div class="cbtn">' + action + '<button class="btn ghost" data-cancel>取消</button></div></div>';
    const adopt = out.querySelector('[data-adopt]');
    if (adopt) adopt.addEventListener('click', () => adoptWeight(out, resp));
    const cancel = out.querySelector('[data-cancel]');
    if (cancel) cancel.addEventListener('click', () => { cancel.textContent = '已取消'; });
  }

  async function adoptWeight(out, resp) {
    const sid = resp.rule && resp.rule.suggestion_id;
    if (!sid) { window.alert('缺少 suggestion_id，无法采纳'); return; }
    try {
      const r = await window.api('/llm/weight/apply', { method: 'POST', body: window.aiBody({ suggestion_id: sid }) });
      out.innerHTML = '<div class="ai-rule"><div class="rh">已采纳 · 权重已更新</div><div class="rb"><pre>'
        + window.escapeHtml(JSON.stringify(r, null, 2)) + '</pre></div></div>';
    } catch (e) {
      window.alert((e.body && e.body.message) || e.message);
    }
  }
})();
</script>

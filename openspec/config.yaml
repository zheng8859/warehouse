context: |
  # 成品库位智能推荐（康饮台塑立体库）

  文档基线：PRD-详细版 v0.16。设计事实来源为 `产品设计/` 下编号文档
  （09 总览 / 10 冷路径 / 11 页面流程 / 12 信息架构 / 13 权限 / 14 推荐引擎 /
  15 三类作业与后验 / 16 数据衔接与 cap / 17 数据模型 / 18 KPI / 19 架构 /
  20 评测 / 21 设计系统 / 22 前端规格 / 23 十一维自检）。
  实体字段口径以 17 为准，系统形态与边界以 19 为准。

  ## 一句话定位

  单端、单主流程产品 —— 操作员通过一个 Web 界面，围绕「从物料号到集中就近落位」展开：
  入库决定「放得集中不集中」，出库兑现「取得顺不顺路」，移库补救「历史欠账」，
  后验负责「说了算不算数」。

  要治的根因：**均分即散落根因**。同物料在库内跨巷道 11.7~22.4，单张 DO 跨 6~8 巷道，
  出库退化为「全库筛」而非「顺路取」。

  主流程：PO / DO / 库存快照（文件导入）→ 取数 → 6 因子评分 → 软推荐巷道集（带理由）
  → 人工确认 → 库位族 → 本系统落位台账 → 后验。**核心链路对外 = 无**。

  ## 四条不可推翻的设计原则

  1. **L1 软推荐** —— 系统只给建议与理由，落位决策权在人，绝不静默改写落位。
  2. **独立部署 + 文件级衔接** —— 不依赖任何外部系统实时接口。
  3. **核心链路不出域** —— 评分 / 落位 / 后验 / 台账不依赖外部模型。
  4. **冷路径 AI 可选** —— 脱敏 + 审批后统一调用外部 LLM，不做本地部署，可一键关闭。

  ## 技术栈（既定决策）

  选型来源：09 号总览注册表「25-环境搭建」（已发布）—— 其中 8 Step 明确
  `Python venv + FastAPI/SQLAlchemy/pandas/openpyxl`，附录含「技术栈速查 / 可选 Docker」。
  注意 25 号正文尚未撰写（`产品设计/` 目录现只到 24 号），故本条以注册表行 + 团队确认为准。
  19 号架构文档只约束**形态**（单应用 + 单库、WAL、无中间件），不约束语言/框架 ——
  两者不冲突：**形态来自 19，选型来自 09 与本次确认**。以下选型已定，
  下游 design / tasks **不得重新论证选型本身**。

  | 层 | 选型 | 状态 |
  |---|---|---|
  | 后端 | Python + FastAPI + SQLAlchemy | 既定 |
  | 文件解析 | pandas + openpyxl（xlsx）、标准库 csv | 既定 |
  | 前端 | **零构建**：原生 HTML + 语义化 class + Vanilla JS；设计令牌为 CSS 变量（`:root`）；可选 Tailwind CDN 映射令牌。无前端框架、无组件库、无构建工具 | 既定（21 号） |
  | 数据库 | **SQLite**（单库，**必须开启 WAL 模式**） | 已定 |
  | 部署 | 企业内网独立部署；单体应用（1 进程/容器，2~4 vCPU / 4~8 GB）；容器或裸进程均可；Docker 可选 | 既定 |
  | 中间件 | **无 Redis / RabbitMQ** —— 任务队列用本地库状态表 | 既定 |
  | 外部依赖 | **0 个实时接口**；与 WMS / SAP 仅文件级衔接 | 既定 |
  | 账号 | 首期本地基础账号 + 会话登录（Session/JWT，建议 8 小时）；企业 SSO 为路线图 | 既定 |

  - **Node.js 仅用于工具链**（Claude Code CLI / OpenSpec），**不进入应用运行时** ——
    不要因为工具链用 npm 就把本项目当成 Node 项目。
  - **SQLite 并发约束（重要）**：WAL 下多读单写。应用**必须单进程运行**
    （与 19 号「1 进程/容器」一致），**不得以多 worker 并发写**；写并发由
    `JobOrder` / `ImportSession` 的乐观锁版本号保证，`busy_timeout` 仅作兜底。
    「cap 与台账同事务写入 + 事务整体回滚」的语义**必须由真实事务保证**，不得用应用层补偿代替。
  - SQLAlchemy 为 DBMS 无关选型 —— 若日后多厂推广需换库属连接串级变更，
    但**不要在任何 change 里重新讨论库选型**。
  - 数据留存：`Ledger` / `Verification` 永久，`Snapshot` ≥90 天，导入原文件 ≥30 天。
  - 冷路径仅开启时向外部 LLM 出站（脱敏后），**默认关闭**。
  - 支持文件格式 `xlsx` / `csv`；编码自动探测 `UTF-8` / `UTF-8-BOM` / `GBK`，其他格式阻断。

  ## 语言与工程约定

  - 界面文案、规格、台账字段一律中文；书面术语与 17 号文档一致。
  - **实体名 PascalCase**（`JobOrder`、`RecommendationPlan`、`Ledger`、`Verification`、
    `ImportSession`、`Snapshot`、`AisleCap`、`KpiSnapshot`、`WeightConfig`、`CapacityConfig`）。
  - **字段名 snake_case**（`warehouse_id`、`location_code`、`material_code`、`batch_no`、
    `qty`、`snapshot_time`、`order_no`、`line_no`、`aisle`、`snapshot_version`、
    `cap_total` / `cap_reserved` / `cap_usable`）。
  - **枚举值全大写**，取值以 17 号 §九 的 11 个枚举为准：`job_type` = `INBOUND`/`OUTBOUND`/`RELOCATE`；
    `job_status` = `PENDING`/`PLANNED`/`CONFIRMED`/`REJECTED`/`CANCELLED`/`EXECUTED`/`VERIFIED`；
    `import_status` = `DRAFT`/`VALIDATING`/`VALIDATED`/`FAILED`/`IMPORTING`/`IMPORTED`/`BASELINE`/`DISCARDED`；
    `file_type` = `PO`/`DO`/`INV`；`ledger_type` = 同 `job_type`；
    `disposition` = `ACCEPT`/`TUNE`/`REJECT`；`abc_class` = `A`/`B`/`C`；
    `role` = `warehouse_keeper`/`planner`/`supervisor`/`admin`；
    `account_status` = `pending`/`active`/`disabled`/`rejected`；`verify_result` = `PASS`/`DEVIATION`。
  - **API 路径小写、层级式**：`/api/import/*`、`/api/snapshot/*`、`/api/cap/*`、
    `/api/allocate/batch`、`/api/job/*`、`/api/kpi/snapshot`、`/api/llm/toggle`、`/api/health`。
  - **库位号为 6 位文本**，前 2 位 = 巷道（`010104` → 巷道 01）。所有巷道级聚合对库位号 `[:2]` 切片。
    库位号必须按文本读取 —— Excel 数值化会丢失前导 0；Excel 日期序列号须先转日期再比对。
  - 每个实体携带 `warehouse_id` 隔离过滤；库存行唯一键 = 库位号 + 批号（+ 料号），
    PO/DO 行唯一键 = 单据号码 + 行号。
  - 工程铁律：**先校验后导入**、**校验失败阻断（不带病入库）**、**不静默降级**（任何容错都要在
    回执或推荐理由中写明）、**严禁按列序号硬取**、**导入即基准**、**决策权在人**。

  ## 核心领域概念

  **四类导入文件**：生产订单 PO（→ 入库待推荐队列）、交货单 DO（→ 出库拣配任务）、
  库存快照 INV（→ cap 基线 + 既有库位/批次分布）、成品清单·历史出入库流水
  （统计类，→ ABC 分类与「以出定入」的出库量，不产生队列、不建基线）。

  **cap 三指标**（`AisleCap`）：
  ```
  cap_total    = 巷道总格数 − 已占格数          （基线来自库存快照）
  cap_reserved = cap_total × 近站台预留比例      （默认 40%，仅近站台巷道）
  cap_usable   = cap_total − cap_reserved       （非 A 类可用）
  ```
  每次快照导入（`IMPORTED → BASELINE`）触发按巷道**全量重算**，生成新版本、旧版归档；
  作业导致的增减为**事务内增量**，与台账同事务写入。**快照是权威，增量是过程**，
  两者差异即「漂移」，超阈值（建议 >1%）告警并以重算值校正。

  **6 因子评分**（固定，**不得增删**）：ABC / 巷道 cap / 既有库位 / 站台就近 / 批次 / 连续性。
  权重经 `WeightConfig` 配置（变更后下次评分生效，历史版本保留可回滚）。
  **资源仲裁与位置选择分离**：批量分配决定「谁先挑」，6 因子评分决定「挑哪个巷道」；
  **确定性优先** —— 同样输入必得同样输出，不用随机搜索、不用大模型生成。

  批量分配流程：队列构建 → 优先级排序（未来 N 天出库量 + ABC 等级 + 既有集中度增益）
  → 资源快照（含预留扣减）→ 竞争分配（贪心）→ 产出方案 → 人工逐单确认 L1。
  降级链：近站台 → 次近巷道 → 远巷道 → 溢出区；出库无降级链（缺数据即阻断）。

  ## 核心红线（系统必须 / 不得）

  - **推荐单元 = 物料号级**：不做板号级、不做批号级推荐。
  - **决策权在人**：方案须逐单确认，系统不自动落位。
  - **写操作必须弹二次确认卡，未确认不产生台账**；落位 / 出库确认 / 移库执行皆然。
  - **出库为只读派生**：顺路取按巷道聚合既有库位/批次，**不触发评分引擎、不重新决定落位**。
  - **移库不改批号**：只调整所在巷道，不改变批次归属与 FIFO 顺序。
  - **非 A 类订单不得占用预留池**；预留池在配置时点（默认当日 18:00）未被 A 类用完则自动释放给 B/C 类。
  - **批次号在入库过账时生成**，PO 文件不含批号。
  - **重量不纳入推荐引擎**（由码垛机设备层自动校验）。
  - **台账由引擎/作业流自动写**，`ledger.write` 不向任何角色开放手动入口；同一作业单 `EXECUTED`
    后不允许重复写台账（状态机守卫 + 乐观锁）。
  - **库存快照缺失或过期（出库）→ 阻断并提示重新导入**，不猜测落位；口径校验失败 → 阻断导入。
  - **核心链路（评分/落位/后验/台账）数据不出企业域**；冷路径 LLM 仅外发脱敏后的意图文本。
  - **待检状态转换不归本系统**（属品管流程）。

  `JobOrder` 状态机（`15` §3.1）：
  ```
  PENDING   → PLANNED   : 批量分配/生成方案成功
  PENDING   → PENDING   : 批量分配失败可重试
  PLANNED   → CONFIRMED : 操作员确认 L1
  PLANNED   → REJECTED  : 操作员驳回
  REJECTED  → PENDING   : 重新入队
  CONFIRMED → EXECUTED  : 写台账成功
  CONFIRMED → PLANNED   : 写台账失败/回滚
  EXECUTED  → VERIFIED  : 后验完成
  PENDING / PLANNED → CANCELLED : 移出本次批量
  ```

  ## 权限模型

  4 个角色：`warehouse_keeper` 仓管员 / `planner` 生产计划员 / `supervisor` 仓储主管 /
  `admin` 管理员。首期**不做细粒度 RBAC** —— 只有角色菜单可见性 + 写操作二次确认；
  `ROLE_PERMISSIONS` 矩阵（13 号）是权威目标模型，RBAC 落地后由后端 checker 强制。

  资源·动作标识：`account.manage`、`data_import.view|operate`、`inbound.view|operate`、
  `outbound.view|operate`、`relocate.view|operate`、`kpi.view`、`config.view|configure`、
  `conversation.view|operate`、`ledger.view|write`、`engine.invoke`。
  要点：主管仅 `relocate` 可执行、`config` 限权重子模块；`ledger.write` 与 `engine.invoke`
  对业务角色均不开放手动入口；免认证白名单 `/api/auth/login`、`/health`、`/docs`、`/openapi.json`。

  ## 冷路径（AI 辅助，可选增强）

  热路径严禁 LLM：6 因子评分、软推荐、落位执行、后验比对、台账记录 —— 必须本地确定性。
  冷路径 4 类能力：KPI 解读（P1）/ 偏离归因（P1）/ 权重调优建议（P2）/ 移库方案生成（P1）。
  统一链路：`结构化数据（规则算）→ LLM 生成（人话）→ 规则校验（仅写操作）→ 人工确认 L1`。

  三条不可逾越红线：**LLM 不参与实时评分与排序**、**LLM 不直接执行写操作**、
  **LLM 产出不经规则校验不进台账**。所有 AI 输出必须渲染为琥珀色并标注
  「AI 建议，仅供参考，需人工核实，不自动执行」，**不得渲染成系统结论**。
  对话台意图识别分层：L0 结构化入口（必做）→ L1 规则/模板匹配（推荐）→ L2 外部 LLM NLU（可选）
  → **L3 自主规划型 Agent 不做**。

  ## 范围边界（不做清单，不得加回）

  通用 WMS 替代 / 接管落位决策（静默改写）/ 板号级推荐 / 批号级推荐 / 待检状态转换与品管联动 /
  平置仓·环穿立库 / 与 WMS 实时同步 / 系统间实时接口对接 / 核心链路依赖外部大模型或数据出域 /
  冷路径未经脱敏即调外部 LLM / 自主规划型 Agent（静默执行写操作）。

  其中后三项为 **Kano 反向质量** —— 做了反而损害产品价值观（确定性、可审计、数据不出域）。

  另明确不做：实时流式计算、跨厂对比统计、KPI 阈值自学习、LLM 生成 KPI、指标对外推送、
  A/B 测试（单厂单一活跃队列无法拆流量，用前后对比）、用户行为埋点。

  ## 验收基线（写规格时必须落到具体数字）

  | 指标 | 阈值 | 基线 | 定位 |
  |---|---|---|---|
  | 拣货量加权集中度 | 80% 拣货量落在 ≤N 巷道，N=5（可配） | 单 DO 跨 6~8 | 统一验收指标 |
  | 同物料跨巷道数 | ≤5 | 11.7~22.4 | 质量门控 |
  | 同批跨巷道数 | ≤3 | 5.8~21.8 | 质量门控 |
  | 推荐采纳率 | ≥60% | — | 输入（采纳质量） |
  | 后验达标率 | 三项口径同时达标 | — | 质量门控 |
  | 落位准确率 | ≥99% | — | 护栏 |
  | 周有效收拢入库批次 | 试点期 ≥30 | — | **北极星** |
  | 单张开单跨巷道数 | 仅记录，不卡硬验收 | 6~8 | 参考监控 |

  - 后验口径：入库 = 同物料跨巷道 ≤5 **且** 同批跨巷道 ≤3；出库 = 加权集中度 80% ≤ N；
    移库 = 移库后同物料跨巷道数低于移库前。
  - Go/No-Go 硬闸门：试点期末加权集中度达成率 ≥70% 且趋势向好；护栏（数据出域 = 0、
    落位准确率 ≥99%、无静默改写落位/越权改配置）全过 → Go；任一护栏失败 → 立即回滚。
    回滚为**功能开关式**（一键关闭推荐、恢复均分），**不删历史台账**。
  - 性能 SLA：解析 ≤5min/文件；cap 查询 ≤100ms；单物料评分 ≤1s；确认→库位族 ≤500ms；
    落位写入 ≤200ms；后验 ≤1s；看板刷新 ≤3s；对话台 → 外部 LLM ≤2s（可降级）。
  - 工程参数：单次批量单据 ≤50 单；预留比例 40%；预留超时释放 18:00；快照节奏每日早 8 点
    反馈前日 24 点；并发控制用乐观锁版本号；后验在台账写入成功后自动触发。

  ## 范围与编号约定

  **首期单厂试点，工厂编码 `GTJ10036`**（GTJ1 广州顶津旗下单个 WMS 仓库代码，非全厂）；
  GTJ10023 / TTJ20021 / TYP10021 因编码体系不同需逐厂映射。字段映射首期内置，不做可视化配置。

  P0 首期功能（编号以 `08-功能优先级排序` 为准，**权威**）：
  F1 文件级数据导入 · F2 数据衔接契约配置 · F3 物料号级评分引擎 · F4 软推荐巷道集（带理由）·
  F5 操作员确认 L1 · F6 库位族推荐 · F7 落位执行与台账 · F8 落位后验 · F9 巷道 cap 自维护 ·
  F10 集中度 KPI 看板（含出库顺路取）· M0 对话式操作台。

  关键路径（缺一不可）：`F1 → F2 → F9 → F3 → F4 → F5 → F6 → F7 → F8 → F10`，总工时约 56 人天。
  P1 路线图：M1 移库补救 · M2 多厂编码映射 · M3 推荐结果导出 · M4 企业 SSO · M5 精细 RBAC ·
  M6 审计日志 · M7 报告资产化 · M8~M12 冷路径 · M13 成本配额 · M14 内容安全审核。

  > ⚠️ `20-评测体系设计` 使用了**另一套** F1~F10 编号（F1 数据导入 / F2 评分引擎 / F3 批量分配 /
  > F4 库位族 / F5 落位执行 / F6 顺路取出库 / F7 移库补救 / F8 KPI 看板 / F9 对话台 / F10 配置）。
  > 写规格时不要混用两套编号。

  ## 术语表

  | 术语 | 含义 |
  |---|---|
  | 软推荐 / L1 | 系统给建议与理由，人做最终落位决策 |
  | 巷道 | 库位号前 2 位；所有容量聚合的粒度 |
  | 库位族 | 落位时同物料/同批的推荐库位集合 |
  | 顺路取 | 出库按巷道聚合的拣货顺序，只读派生 |
  | 收拢 | 把散落的同物料/同批库存集中回主巷道（移库） |
  | 以出定入 | 用未来 N 天交货单出库量决定入库优先级 |
  | 偏离批次 | 后验不达标、跨巷道数超阈值的批次，进 `Deviation` |
  | 热路径 / 冷路径 | 本地确定性核心链路 / 可选外部 LLM 辅助链路 |
  | 溢出区 | 容量不足时降级链的最后一档 |

  ## 评测与自检

  三层评测金字塔（13 维 / 60 场景）：基线层 5 维×24（代码可精确断言，每次构建跑，秒级零外部依赖）、
  边界层 4 维×20（异常注入）、回归层 4 维×16（统计/趋势，周/里程碑触发）。
  基线层维度：评分正确性、作业闭环一致性、KPI 计量正确性、配置合规与权限、安全隔离。
  场景编号：`SC-001~006`（评分）、`CL-001~006`（闭环）、`AC-001~005`（分配合规）、`TR-001~005`（集中度趋势）。

  十一维企业级自检（`23`）中维度 7 持续变好 / 8 成本上限 / 10 审计字段 / 11 运维响应
  在 v1 仍属**路线图未实现**，不得在规格中声称已具备。

# Per-artifact rules
rules:
  proposal:
    - 用中文撰写，标题与正文使用 17 号文档的实体名、字段名、枚举值，不要另造术语
    - 必须包含「非目标」章节，且不得与「不做清单」11 项冲突；新增能力若触碰红线须显式说明理由
    - 引用 P0 功能时使用 08 号的 F 编号，并说明落在关键路径的哪一环
    - 明确列出受影响的实体、API 路由（按 /api/* 约定）与 KPI 指标
    - 不得把本 config 的技术栈与领域知识复述进正文，只作为写作约束
  specs:
    - 每条需求写成可断言的「系统必须…」/「系统不得…」，避免「支持」「优化」「尽量」等模糊措辞
    - 场景用 Given/When/Then；状态迁移必须与 JobOrder 状态机一致，不得新增未定义状态
    - 所有阈值写具体数字（≤5、≤3、N=5、40%、18:00、≥99%、≤50 单），不得写「合理阈值」
    - 涉及写操作的需求必须包含二次确认与「未确认不产生台账」
    - 涉及降级/异常的需求必须写明降级链与「降级不静默」（降级原因须在推荐理由中可见）
    - 不得为「不做清单」中的能力编写需求；不得为 P1 路线图功能编写需求，除非本次 change 显式声明
  design:
    - 复用既有实体与 API，不新增平行台账 —— 台账只有 Ledger 一套，由引擎/作业流自动写
    - 核心链路不得引入外部 LLM/API 依赖；涉及冷路径时必须写明脱敏、审批、可一键关闭、人工确认
    - 必须论证确定性：同样输入必得同样输出，不得使用随机搜索或大模型生成落位
    - 涉及 cap 时区分「快照导入全量重算」与「事务内增量」，并说明漂移对账与告警处理
    - 涉及权限时写明 resource.action 标识，并对照 13 号 ROLE_PERMISSIONS 矩阵
    - 写明性能目标，引用 08 号 §14.1 的 SLA 数值
    - 写明失败与恢复路径：事务回滚、状态机回退、功能开关式回滚且不删历史台账
    - 前端方案必须保持零构建（原生 HTML/CSS/JS + CSS 变量令牌），不引入框架或构建工具
  tasks:
    - 按关键路径排序 F1 → F2 → F9 → F3 → F4 → F5 → F6 → F7 → F8 → F10（含 M0 对话台壳）
    - 每个任务标注影响的文件/模块，以及验证方式（对应的评测场景编号）
    - 必须包含基线层评测场景的落地任务（引擎单测：评分正确性、作业闭环一致性、KPI 计量正确性）
    - 必须包含异常/边界任务：导入校验失败阻断、cap 不足降级、快照过期阻断、乐观锁并发冲突
    - 必须包含后验与 KpiSnapshot 聚合的实现任务
    - 单个任务拆到 ≤2 天可完成

# Per-operation guidance
operations:
  apply:
    guidance:
      - 先跑基线层评测（引擎单测 / 数据校验脚本，秒级、零外部依赖），再跑边界层异常注入场景
      - 每完成一个任务就更新对应 spec 场景的通过状态，不要最后一次性核对
      - 实现落位/确认类写操作时，先确认二次确认卡与状态机守卫到位，再写台账落库逻辑
      - 变更 6 因子权重、cap 口径、预留比例等配置项时，保留历史版本以支持回滚
      - 不得引入外部 LLM/API 到核心链路；冷路径相关任务必须默认关闭且可一键开关
      - 汇报进度时如实说明未通过项与跳过的验证，不要用「基本完成」掩盖失败
  archive:
    guidance:
      - 归档前确认 proposal 的「非目标」与「不做清单」未被实现代码绕过
      - 汇总本次 change 对北极星指标与后验口径的影响，说明是否影响 Go/No-Go 判定
      - 记录新增或变更的实体字段、API 路由、配置项，便于后续 change 引用
      - 汇总归档结果后再结束，不要静默归档
